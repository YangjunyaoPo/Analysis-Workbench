name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python and JavaScript (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Storage and HTTP tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Numerical and filtering tests
        run: node --test tests/core.test.mjs tests/diagnosis.test.mjs tests/archive-filters.test.mjs
      - name: Check browser module syntax
        run: |
          node --check prototype/app.mjs
          node --check prototype/archive.mjs
